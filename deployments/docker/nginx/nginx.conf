server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # Proxy gRPC-web requests to KC-Gateway.
    # proxy_buffering off is required for server-streaming RPCs (StreamEvents,
    # StreamMessages, StreamBaseStationEvents, StreamEndPointEvents, etc.)
    location ~ ^/kilocenter\.api\.v1\. {
        proxy_pass                  http://kc-gateway:9090;
        proxy_http_version          1.1;
        proxy_buffering             off;
        proxy_request_buffering     off;
        proxy_read_timeout          3600s;
        proxy_send_timeout          3600s;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
