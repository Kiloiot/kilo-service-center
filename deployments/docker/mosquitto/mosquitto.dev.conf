# Mosquitto Configuration for KiloCenter
# Eclipse Mosquitto 2.0.18+

# General Settings
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Listener Configuration
listener 1883
protocol mqtt

# WebSocket Support
listener 9001
protocol websockets

# Authentication
allow_anonymous false
password_file /mosquitto/config/passwd

# Note: After initial setup, change to:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# Access Control
# In production, also use:
# acl_file /mosquitto/config/acl

# Message Settings
max_queued_messages 1000
max_queued_bytes 0
max_inflight_messages 20
max_keepalive 65535

# MQTT v5 Support
# protocol_version mqttv5

# System Topics
sys_interval 10

# Bridge Configuration (if needed for clustering)
# connection bridge-01
# address remote-broker:1883
# topic # both 2 mioty/ mioty/
# cleansession false
# notifications false
# try_private true

# TLS/SSL Configuration (for production)
# listener 8883
# protocol mqtt
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate true
# use_identity_as_username true
