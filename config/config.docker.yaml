# KiloCenter Docker Configuration File

general:
  server_name: "KiloCenter"
  environment: "production"
  edition: "ce"
  org_enforcement_enabled: false
  log_level: "info"
  log_format: "json"
  health_check_port: 8086

protocol:
  # Base Station Service Center Interface (BSSCI)
  bsci_port: 5000
  bsci_tls:
    enabled: true
    cert_file: "/app/certificates/server.crt"
    key_file: "/app/certificates/server.key"
    ca_file: "/app/certificates/ca.crt"
    min_version: "1.2"

  # Service Center Application Center Interface (SCACI)
  scaci_enabled: true
  scaci_host: "0.0.0.0"
  scaci_port: 5001
  scaci_tls:
    enabled: true
    cert_file: "/app/certificates/server.crt"
    key_file: "/app/certificates/server.key"
    ca_file: "/app/certificates/ca.crt"
    min_version: "1.3"
  # Operations a disconnected Application Center session holds for its resume;
  # one more ends the session's resumability.
  scaci_resume_max_pending_operations: 10000

  # Protocol parameters
  ack_timeout: 5000
  connection_establishment_timeout: 30000
  socket_write_timeout: 10000
  status_request_interval: 30
  status_request_initial_delay: 5
  dlrx_query_timeout: 300
  dlrx_cleanup_interval: 60
  duplicate_window: 300
  # Outbox delivery worker: stored uplinks are fanned out to SCACI and MQTT
  # from the message_delivery_outbox table; failures retry with an exponential
  # backoff capped at max_backoff until delivered, permanent failures park.
  # A new uplink is due once reception_window has passed, so the receptions of
  # the other base stations that heard it are in its one ulData.
  delivery:
    poll_interval: "1s"
    batch_size: 50
    retry_backoff: "2s"
    max_backoff: "5m"
    reception_window: "500ms"
  # Downlink lifetime: a downlink not handed to a base station within lifetime
  # expires; the sweep reports it to its Application Center (dlDataRes), to the
  # MQTT downlink_result topic and in the downlink results.
  downlink_expiry:
    lifetime: "24h"
    sweep_interval: "5s"
    batch_size: 100
    # POSIX codes of a dlDataRev refusal that say the base station does not
    # hold the downlink (BSSCI 3.17 names none; 2 is ENOENT).
    revoke_not_held_codes: [2]
  message_encoding: "msgpack"
  bsci_certificate_poll_interval: "10s"
  # Service Center EUI. Empty defers to KILOCENTER_PROTOCOL_SC_EUI, the legacy
  # SERVICE_CENTER_EUI environment variable, or the built-in default.
  sc_eui: ""

certificates:
  certgen_path: "/usr/local/bin/certgen"
  server_validity_days: 365

storage:
  type: "postgres"
  host: "postgres"
  port: 5432
  database: "kilocenter"
  username: "kilocenter"
  password: "changeme"
  ssl_mode: "disable"
  max_connections: 25
  max_idle_conns: 5
  conn_max_lifetime: 300
  conn_max_idle_time: 60
  enable_migrations: true
  message_retention_days: 90
  archival_enabled: true

mqtt:
  enabled: true
  host: "mosquitto"
  port: 1883
  client_id: "kilocenter-server"
  username: "admin"
  password: "KiloCenter"
  topic_prefix: "mioty"

monitoring:
  metrics_enabled: false
  metrics_port: 9091

grpc:
  enabled: true
  port: 50051
  host: "0.0.0.0"
  rbac_role_cache_ttl_seconds: 30
  internal_trust_enabled: true
  web:
    enabled: false

status:
  timeout: 5s
