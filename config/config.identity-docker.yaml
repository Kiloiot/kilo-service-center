general:
  server_name: "KiloCenter Identity"
  environment: "production"
  log_level: "info"
  log_format: "json"
  health_check_port: 8088
  tenant_id: 1

storage:
  host: "postgres"
  port: 5432
  database: "kilocenter"
  username: "kilocenter"
  password: "changeme"
  ssl_mode: "disable"
  max_connections: 25
  max_idle_conns: 10
  conn_max_lifetime: 300
  conn_max_idle_time: 60
  enable_migrations: true

grpc:
  port: 50052
  host: "0.0.0.0"
  internal_trust_enabled: true
  web:
    enabled: false
  enable_reflection: true
  enable_health: true

auth:
  enabled: true
  local_login_enabled: true
  registration_enabled: true
  hmac_secret: "dev-secret-must-be-at-least-32-bytes-long"
  access_token_ttl: 15m
  refresh_token_ttl: 24h
  refresh_token_enabled: true
  issuer: "kilocenter"
  audience: "kilocenter-api"
  algorithm: "HS256"
  tenant_claim: "tenant_id"
  bootstrap:
    enabled: false

redis:
  host: "redis"
  port: 6379
  database: 0
  pool_size: 10
