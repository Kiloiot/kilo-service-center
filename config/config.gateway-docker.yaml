# KC-Gateway Docker Configuration (ECE)

gateway:
  upstream_address: "kilocenter:50051"
  identity_address: "kc-identity:50052"
  health_port: 8087
  rate_limit:
    enabled: true
    requests_per_min: 5
    burst: 3
    cleanup_interval: 10m

internal_auth:
  peer_secret: ""

grpc:
  port: 9090
  host: ""
  web:
    enabled: true
    allowed_origins:
      - "http://localhost"
      - "http://localhost:80"
      - "http://localhost:5173"
    allow_credentials: true
    enable_websockets: true

auth:
  enabled: true
  local_login_enabled: true
  refresh_token_enabled: true
  access_token_ttl: 15m
  refresh_token_ttl: 24h
  hmac_secret: "dev-secret-must-be-at-least-32-bytes-long"
  tenant_claim: "tenant_id"
  issuer: "kilocenter"
  audience: "kilocenter-api"

monitoring:
  metrics_enabled: false

general:
  server_name: "KC-Gateway"
  environment: "production"
  edition: "ce"
  org_enforcement_enabled: false
  log_level: "info"
  log_format: "json"
