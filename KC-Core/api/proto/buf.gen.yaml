version: v1
plugins:
  - name: go
    out: ../gen
    opt:
      - paths=import
      - module=github.com/Kiloiot/kilo-service-center/KC-Core/api/gen
  - name: go-grpc
    out: ../gen
    opt:
      - paths=import
      - require_unimplemented_servers=false
      - module=github.com/Kiloiot/kilo-service-center/KC-Core/api/gen
