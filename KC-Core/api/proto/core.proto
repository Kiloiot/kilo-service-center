  oneof item {
    Event event = 2;
    Message message = 3;
  }
}

// Event streaming request messages
// All timestamps are optional; nil defaults to zero time in handlers
message StreamEventsRequest {
  string category = 1;      // Optional: filter by category
  string severity = 2;      // Optional: filter by severity
  google.protobuf.Timestamp start_time = 3;  // Optional: filter events after this time
  google.protobuf.Timestamp end_time = 4;    // Optional: filter events before this time
}

