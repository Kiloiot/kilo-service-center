syntax = "proto3";

package kilocenter.api.v1;

option go_package = "github.com/Kiloiot/kilo-service-center/KC-Core/api/gen/kilocenter/v1;kilocenterv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";

// CoreService handles device management, protocol operations, analytics,
// monitoring, certificates, blueprints, and integrations.
service CoreService {
  // End Point management
  rpc CreateEndPoint(CreateEndPointRequest) returns (EndPoint);
  rpc GetEndPoint(GetEndPointRequest) returns (EndPoint);
  rpc UpdateEndPoint(UpdateEndPointRequest) returns (EndPoint);
  rpc DeleteEndPoint(DeleteEndPointRequest) returns (google.protobuf.Empty);
  rpc ListEndPoints(ListEndPointsRequest) returns (ListEndPointsResponse);

  // End Point attach/detach operations
  rpc AttachEndPoint(AttachEndPointRequest) returns (AttachEndPointResponse);
  rpc DetachEndPoint(DetachEndPointRequest) returns (DetachEndPointResponse);

  // Base Station management
  rpc CreateBaseStation(CreateBaseStationRequest) returns (BaseStation);
  rpc GetBaseStation(GetBaseStationRequest) returns (BaseStation);
  rpc UpdateBaseStation(UpdateBaseStationRequest) returns (BaseStation);
  rpc DeleteBaseStation(DeleteBaseStationRequest) returns (google.protobuf.Empty);
  rpc ListBaseStations(ListBaseStationsRequest) returns (ListBaseStationsResponse);
  rpc GetBaseStationStats(GetBaseStationStatsRequest) returns (GetBaseStationStatsResponse);
  rpc UpdateBaseStationEui(UpdateBaseStationEuiRequest) returns (BaseStation);
  // Per-bucket availability (online fraction) time series for a base station.
  rpc GetBaseStationAvailability(GetBaseStationAvailabilityRequest) returns (GetBaseStationAvailabilityResponse);
  // Per-bucket received-message (RX uplink) counts time series for a base station.
  rpc GetBaseStationMessagesReceived(GetBaseStationMessagesReceivedRequest) returns (GetBaseStationMessagesReceivedResponse);

  // Message operations
  rpc GetMessage(GetMessageRequest) returns (Message);

  // Downlink operations
  rpc SendDownlink(SendDownlinkRequest) returns (SendDownlinkResponse);
  rpc RevokeDownlink(RevokeDownlinkRequest) returns (RevokeDownlinkResponse);
  rpc ListDownlinkQueue(ListDownlinkQueueRequest) returns (ListDownlinkQueueResponse);
  rpc GetDownlinkResults(GetDownlinkResultsRequest) returns (GetDownlinkResultsResponse);

  // UL Data Transmit operations (BSSCI 3.11)
  rpc SendULTransmit(SendULTransmitRequest) returns (SendULTransmitResponse);

  // Base Station operations (BSSCI 3.5)
  rpc RequestBaseStationStatus(BaseStationStatusRequest) returns (BaseStationStatusResponse);

  // Base Station Ping operation (BSSCI §5.4)
  rpc InitiatePing(InitiatePingRequest) returns (InitiatePingResponse);

  // DL RX Status operations (BSSCI 3.15-3.16)
  rpc GetDLRXStatus(GetDLRXStatusRequest) returns (GetDLRXStatusResponse);
  rpc QueryDLRXStatus(QueryDLRXStatusRequest) returns (QueryDLRXStatusResponse);
  rpc GetDLRXStatusQueries(GetDLRXStatusQueriesRequest) returns (GetDLRXStatusQueriesResponse);

  // System operations
  rpc GetSystemStatus(google.protobuf.Empty) returns (SystemStatus);
  rpc GetStatistics(GetStatisticsRequest) returns (Statistics);
  rpc GetReleaseInfo(google.protobuf.Empty) returns (ReleaseInfo);

  // Integrations
  rpc CreateIntegration(CreateIntegrationRequest) returns (Integration);
  rpc GetIntegration(GetIntegrationRequest) returns (Integration);
  rpc UpdateIntegration(UpdateIntegrationRequest) returns (Integration);
  rpc DeleteIntegration(DeleteIntegrationRequest) returns (google.protobuf.Empty);
  rpc ListIntegrations(ListIntegrationsRequest) returns (ListIntegrationsResponse);

  // Analytics
  rpc GetAnalyticsOverview(GetAnalyticsOverviewRequest) returns (GetAnalyticsOverviewResponse);
  rpc GetActivityAnalytics(GetActivityAnalyticsRequest) returns (GetActivityAnalyticsResponse);
  rpc GetSignalQualityAnalytics(GetSignalQualityAnalyticsRequest) returns (GetSignalQualityAnalyticsResponse);

  // Events & Alerts
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // Unified Activity Feed (Events + Messages with pagination)
  rpc ListBaseStationActivity(ListBaseStationActivityRequest) returns (ListBaseStationActivityResponse);
  rpc ListEndpointActivity(ListEndpointActivityRequest) returns (ListEndpointActivityResponse);

  // Event streaming RPCs
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);

  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  rpc GetAlertSummary(GetAlertSummaryRequest) returns (GetAlertSummaryResponse);

  // SCACI Monitoring
  rpc ListScaciSessions(ListScaciSessionsRequest) returns (ListScaciSessionsResponse);
  rpc GetScaciSession(GetScaciSessionRequest) returns (GetScaciSessionResponse);
  rpc GetScaciStatistics(GetScaciStatisticsRequest) returns (GetScaciStatisticsResponse);
  rpc ListScaciErrors(ListScaciErrorsRequest) returns (ListScaciErrorsResponse);
  rpc ListScaciQueues(ListScaciQueuesRequest) returns (ListScaciQueuesResponse);
  rpc GetScaciStatus(GetScaciStatusRequest) returns (GetScaciStatusResponse);

  // Certificates
  rpc GenerateCertificate(GenerateCertificateRequest) returns (GenerateCertificateResponse);
  rpc DownloadCertificate(DownloadCertificateRequest) returns (DownloadCertificateResponse);
  rpc DownloadBaseStationCertificate(DownloadBaseStationCertificateRequest) returns (DownloadCertificateResponse);
  rpc GenerateServerCertificates(GenerateServerCertificatesRequest) returns (GenerateServerCertificatesResponse);
  rpc RenewServerCertificates(RenewServerCertificatesRequest) returns (RenewServerCertificatesResponse);
  rpc GetServerCertificateStatus(GetServerCertificateStatusRequest) returns (GetServerCertificateStatusResponse);

  // Blueprints / Device Catalog - Manufacturers
  rpc CreateManufacturer(CreateManufacturerRequest) returns (CreateManufacturerResponse);
  rpc GetManufacturer(GetManufacturerRequest) returns (GetManufacturerResponse);
  rpc UpdateManufacturer(UpdateManufacturerRequest) returns (UpdateManufacturerResponse);
  rpc DeleteManufacturer(DeleteManufacturerRequest) returns (DeleteManufacturerResponse);
  rpc ListManufacturers(ListManufacturersRequest) returns (ListManufacturersResponse);

  // Blueprints / Device Catalog - Device Models
  rpc CreateDeviceModel(CreateDeviceModelRequest) returns (CreateDeviceModelResponse);
  rpc GetDeviceModel(GetDeviceModelRequest) returns (GetDeviceModelResponse);
  rpc UpdateDeviceModel(UpdateDeviceModelRequest) returns (UpdateDeviceModelResponse);
  rpc DeleteDeviceModel(DeleteDeviceModelRequest) returns (DeleteDeviceModelResponse);
  rpc ListDeviceModels(ListDeviceModelsRequest) returns (ListDeviceModelsResponse);

  // Blueprints / Device Catalog - Blueprints
  rpc CreateBlueprint(CreateBlueprintRequest) returns (CreateBlueprintResponse);
  rpc GetBlueprint(GetBlueprintRequest) returns (GetBlueprintResponse);
  rpc UpdateBlueprint(UpdateBlueprintRequest) returns (UpdateBlueprintResponse);
  rpc DeleteBlueprint(DeleteBlueprintRequest) returns (DeleteBlueprintResponse);
  rpc ListBlueprints(ListBlueprintsRequest) returns (ListBlueprintsResponse);
  rpc SetDefaultBlueprint(SetDefaultBlueprintRequest) returns (SetDefaultBlueprintResponse);
  rpc SubmitBlueprintToRegistry(SubmitBlueprintToRegistryRequest) returns (SubmitBlueprintToRegistryResponse);
  rpc BulkAssignBlueprint(BulkAssignBlueprintRequest) returns (BulkAssignBlueprintResponse);

  // Composite: Create device model + default blueprint atomically
  rpc CreateDeviceModelWithBlueprint(CreateDeviceModelWithBlueprintRequest) returns (CreateDeviceModelWithBlueprintResponse);

  // Blueprint decode preview
  rpc DecodePreview(DecodePreviewRequest) returns (DecodePreviewResponse);

  // Messages (listing + streaming + search/export)
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc StreamMessages(StreamMessagesRequest) returns (stream Message);
  rpc ListBaseStationMessages(ListBaseStationMessagesRequest) returns (ListBaseStationMessagesResponse);
  rpc GetBaseStationMessage(GetBaseStationMessageRequest) returns (GetBaseStationMessageResponse);
  rpc GetBaseStationMessageStats(GetBaseStationMessageStatsRequest) returns (GetBaseStationMessageStatsResponse);
  rpc SearchBaseStationMessages(SearchBaseStationMessagesRequest) returns (SearchBaseStationMessagesResponse);
  rpc ExportBaseStationMessages(ExportBaseStationMessagesRequest) returns (ExportBaseStationMessagesResponse);
  rpc StreamBaseStationMessages(StreamBaseStationMessagesRequest) returns (stream BaseStationMessage);

  // Endpoint-specific message listing
  rpc ListEndpointMessages(ListEndpointMessagesRequest) returns (ListEndpointMessagesResponse);

  // Endpoint Stats/Operations
  rpc GetEndPointStats(GetEndPointStatsRequest) returns (GetEndPointStatsResponse);
  rpc GetEndPointOperations(GetEndPointOperationsRequest) returns (GetEndPointOperationsResponse);

  // Global coverage (server admin only — cross-tenant)
  rpc ListAllBaseStationLocations(ListAllBaseStationLocationsRequest) returns (ListAllBaseStationLocationsResponse);

  // CE onboarding (CE mode only — requires no authentication)
  rpc GetCEStatus(GetCEStatusRequest) returns (GetCEStatusResponse);
  rpc CompleteCEOnboarding(CompleteCEOnboardingRequest) returns (CompleteCEOnboardingResponse);

  // ECE CE registry admin (ECE internal only)
  rpc ListCEInstances(ListCEInstancesRequest) returns (ListCEInstancesResponse);
  rpc RevokeCEInstance(RevokeCEInstanceRequest) returns (RevokeCEInstanceResponse);
}

// ============================================================================
// EndPoint Messages
// ============================================================================

// EndPoint represents a MIOTY End Point (EP)
message EndPoint {
  string epEui = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  string ep_class = 5; // 'Z' for zero-power (unidirectional), 'A' for active (bidirectional)
  bytes nwk_sn_key = 6; // Network Session Key per MIOTY BSSCI v1.0.0
  bytes app_key = 7;
  string status = 8; // active, inactive, suspended
  map<string, string> tags = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp last_seen_at = 12;
  // MIOTY protocol fields per BSSCI v1.0.0 Section 3.8.1
  string attach_status = 13; // attached, detached, attaching, pending
  uint32 sh_addr = 14; // Short address
  bool dual_chan = 15; // Dual-channel mode
  bool repetition = 16; // Repetition flag
  bool wide_carr_off = 17; // Wide carrier offset
  bool long_blk_dist = 18; // Long block distance
  uint32 attach_cnt = 19; // Attachment counter
  bool pre_attach = 20; // Pre-attachment enabled
  uint32 last_packet_cnt = 21; // Last known packet counter (uint32)
  bytes type_eui = 22; // 8-byte Type EUI for blueprint decoding
  int32 carrier_offset = 23; // Carrier offset in Hz
  string device_model_id = 24; // UUID reference to device_models.id for blueprint decoding
  string blueprint_id = 25; // Input selector (not a stored FK); materialized into blueprint_snapshot, echoed on read.
  bytes blueprint_snapshot = 26; // Read-only materialized snapshot; empty = follows catalog default.
}

// BaseStation represents a MIOTY Base Station (BS)
message BaseStation {
  string bsEui = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  google.protobuf.DoubleValue latitude = 5;              // Nullable — absent when not set
  google.protobuf.DoubleValue longitude = 6;             // Nullable — absent when not set
  google.protobuf.DoubleValue altitude = 7;              // Nullable — absent when not set
  string status = 8; // online, offline
  map<string, string> tags = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp last_seen_at = 12;
  // MIOTY status fields (BSSCI v1.0.0 §5.5.2) - wrappers preserve "Not available" semantics
  google.protobuf.Int64Value system_time = 13;           // Unix UTC ns timestamp
  google.protobuf.DoubleValue duty_cycle = 14;           // TX time fraction (0.0-1.0)
  google.protobuf.Int64Value uptime_seconds = 15;        // System uptime in seconds
  google.protobuf.DoubleValue temperature_celsius = 16;  // System temperature
  google.protobuf.DoubleValue cpu_load = 17;             // CPU utilization (0.0-1.0)
  google.protobuf.DoubleValue memory_load = 18;          // Memory utilization (0.0-1.0)
  google.protobuf.Struct bs_config = 19;                 // Configuration object (MIOTY §5.5.2)
  google.protobuf.Timestamp last_status_at = 20;         // Last status reception time
  string service_center_url = 21;                        // BSSCI Service Center URL (tls://host:port)
  string location_source = 22;                           // "gps" or "manual"
  google.protobuf.Timestamp location_updated_at = 23;    // When location was last updated
}

// Subpacket-level radio metrics per BSSCI spec
message SubpacketInfo {
  repeated double snr = 1;
  repeated double rssi = 2;
  repeated int64 frequency = 3;
  repeated double phase = 4;
}

// Per-base-station reception data per SCACI §3.8.1
message BaseStationReceptionInfo {
  string bs_eui = 1;
  int64 rx_time = 2;                              // mandatory (Unix UTC ns)
  double snr = 3;                                  // mandatory
  double rssi = 4;                                 // mandatory
  google.protobuf.DoubleValue eq_snr = 5;          // optional (*float64)
  google.protobuf.Int64Value rx_duration = 6;      // optional (*int64)
  google.protobuf.StringValue profile = 7;         // optional (*string)
  google.protobuf.StringValue mode = 8;            // optional (*string)
  google.protobuf.DoubleValue dl_rx_snr = 9;       // optional (*float64)
  google.protobuf.DoubleValue dl_rx_rssi = 10;     // optional (*float64)
  SubpacketInfo subpackets = 11;                   // optional
}

// Message represents an uplink message from an End Point
message Message {
  string id = 1;
  string epEui = 2;
  string bsEui = 3;
  string tenant_id = 4;
  bytes payload = 5;
  double frequency = 6;
  double rssi = 7;
  double snr = 8;
  double eq_snr = 9;
  string uplink_mode = 10; // standard, low_latency, repeated
  uint32 packet_counter = 11;
  bool dl_open = 12;
  bool res_exp = 13;
  bool dl_ack = 14;
  uint32 crypto_mode = 15;
  google.protobuf.Timestamp received_at = 16;
  bytes decoded_payload = 17;      // JSON-encoded decoded payload from blueprint
  string decode_status = 18;        // Decode status (success/failed/skipped/pending)
  string decode_error_code = 19;    // Blueprint decoder error token (empty on success)
  bytes blueprint_type_eui = 20;    // Type EUI of the blueprint used
  string blueprint_version_id = 21; // UUID of the blueprint version used
  repeated BaseStationReceptionInfo base_stations = 22; // Multi-BS reception data per SCACI §3.8.1
  bool duplicate = 23;              // True when message received by multiple base stations
}

// End Point management requests/responses
message CreateEndPointRequest {
  EndPoint endpoint = 1;
}

message GetEndPointRequest {
  string epEui = 1;
  string tenant_id = 2;
}

message UpdateEndPointRequest {
  EndPoint endpoint = 1;
  // Required. Specifies which fields to update.
  // Supported mask paths: "name", "description", "ep_class", "status",
  //   "sh_addr", "attach_cnt", "dual_chan", "repetition", "wide_carr_off",
  //   "long_blk_dist", "pre_attach", "last_packet_cnt", "carrier_offset",
  //   "nwk_sn_key", "app_key", "device_model_id", "type_eui", "blueprint_id"
  google.protobuf.FieldMask update_mask = 2;
  // New EUI (16-char hex). If set, endpoint.ep_eui identifies the current endpoint
  // and this field specifies the replacement EUI. Cascades to all dependent tables.
  string new_ep_eui = 3;
}

message DeleteEndPointRequest {
  string epEui = 1;
  string tenant_id = 2;
}

message ListEndPointsRequest {
  string tenant_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  string status_filter = 4;
  string device_model_id = 5;  // UUID - filter to one model (bulk coverage preview)
}

message ListEndPointsResponse {
  repeated EndPoint endpoints = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// End Point attach/detach messages
// Note: organization_id is NOT in request - org is resolved from gRPC metadata (x-organization-id)
message AttachEndPointRequest {
  string ep_eui = 1;
}

message AttachEndPointResponse {
  string operation_id = 1;
  string status = 2;
}

message DetachEndPointRequest {
  string ep_eui = 1;
}

message DetachEndPointResponse {
  string operation_id = 1;
  string status = 2;
}

// ============================================================================
// Base Station Messages
// ============================================================================

message CreateBaseStationRequest {
  BaseStation basestation = 1;
}

message GetBaseStationRequest {
  string bsEui = 1;
  string tenant_id = 2;
}

message UpdateBaseStationRequest {
  BaseStation basestation = 1;
  // Required. Specifies which fields to update.
  // Supported mask paths: "name", "description", "latitude", "longitude", "altitude"
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteBaseStationRequest {
  string bsEui = 1;
  string tenant_id = 2;
}

message UpdateBaseStationEuiRequest {
  string bs_eui = 1;      // Current EUI (accepts dashed or non-dashed)
  string new_bs_eui = 2;  // New EUI (accepts dashed or non-dashed)
}

message ListBaseStationsRequest {
  string tenant_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  string status_filter = 4;
}

message ListBaseStationsResponse {
  repeated BaseStation basestations = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Base Station statistics request/response
message GetBaseStationStatsRequest {
  string bsEui = 1;
  string tenant_id = 2;
  google.protobuf.Timestamp start_time = 3;  // Optional time range filter
  google.protobuf.Timestamp end_time = 4;    // Optional time range filter
}

message GetBaseStationStatsResponse {
  string bsEui = 1;
  int64 total_messages = 2;
  int64 total_endpoints = 3;
  int64 messages_today = 4;
  int64 messages_this_week = 5;
  int64 messages_this_month = 6;
  double avg_rssi = 7;
  double avg_snr = 8;
  google.protobuf.Timestamp last_message_at = 9;
  map<string, int64> endpoint_message_counts = 10;  // epEui -> count
  string status = 11;  // online, offline
  google.protobuf.Timestamp last_seen_at = 12;
}

// Base Station availability time series. Returns one online-fraction value per
// UTC-aligned bucket over [start_time, end_time). Buckets are sorted ascending
// by time, missing buckets are 0, and the array length spans the whole range.
message GetBaseStationAvailabilityRequest {
  string bsEui = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  int64 interval_seconds = 4;  // bucket width in seconds (UTC-aligned)
}

message GetBaseStationAvailabilityResponse {
  string bsEui = 1;
  repeated double availability = 2;  // 0..1 per bucket
  int64 interval_seconds = 3;
  google.protobuf.Timestamp last_point_timestamp = 4;  // start of the last bucket
}

// Base Station received-message (RX uplink) time series. Same bucket semantics
// as availability: sorted ascending, missing buckets 0, full range.
message GetBaseStationMessagesReceivedRequest {
  string bsEui = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  int64 interval_seconds = 4;  // bucket width in seconds (UTC-aligned)
}

message GetBaseStationMessagesReceivedResponse {
  string bsEui = 1;
  repeated int64 received = 2;  // uplink message count per bucket
  int64 interval_seconds = 3;
  google.protobuf.Timestamp last_point_timestamp = 4;  // start of the last bucket
}

// ============================================================================
// Message Operations
// ============================================================================

message GetMessageRequest {
  string id = 1;
  string tenant_id = 2;
}

// ============================================================================
// Downlink Operations
// ============================================================================

message SendDownlinkRequest {
  string epEui = 1;
  string tenant_id = 2;
  repeated bytes payloads = 3;  // User data payloads (single entry if not counter-dependent, multiple if counter-dependent)
  reserved 4;  // Removed: port (non-MIOTY)
  float priority = 5;  // MIOTY BSSCI §3.12.1: single precision float (0.0-1.0)
  reserved 6;  // Removed: confirmed (non-MIOTY)

  // MIOTY fields from BSSCI §3.12.1
  bool cnt_depend = 7;   // True if userData is counter dependent
  repeated int64 packet_cnt = 8;  // End Point packet counters (must match payloads length when cnt_depend is true)
  uint32 format = 9;     // User data format identifier, 8 bit
  bool response_exp = 10;    // True to request End Point response
  bool response_prio = 11;   // True to request priority End Point response
  bool dl_wind_req = 12;     // True to request further End Point DL window
  bool exp_only = 13;        // True to send only if End Point expects response
  bool dl_rx_stat_qry = 14;  // SCACI §3.10.1: True to query DL RX status from endpoint
}

message SendDownlinkResponse {
  string id = 1;
  string status = 2;
}

message RevokeDownlinkRequest {
  string epEui = 1;
  string queue_id = 2;
  string tenant_id = 3;
}

message RevokeDownlinkResponse {
  string status = 1;
  string message = 2;
}

message ListDownlinkQueueRequest {
  string tenant_id = 1;
  string epEui = 2; // optional
  int32 page_size = 3;
  string page_token = 4;
}

message ListDownlinkQueueResponse {
  repeated DownlinkMessage messages = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message DownlinkMessage {
  string id = 1;
  string epEui = 2;
  string tenant_id = 3;
  bytes payload = 4;
  reserved 5;  // Removed: port (non-MIOTY)
  float priority = 6;  // MIOTY BSSCI §3.12.1: single precision float
  string status = 7;   // pending, scheduled, transmitted, expired, failed (internal status)
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp scheduled_at = 9;
  google.protobuf.Timestamp transmitted_at = 10;
  string result = 11;  // "sent", "expired", "invalid" per BSSCI §3.14
  int64 tx_time = 12;  // Unix nanoseconds when transmitted
  string bs_eui = 13;  // Base Station EUI that transmitted

  // MIOTY fields from BSSCI §3.12.1
  bool cnt_depend = 14;
  repeated int64 packet_cnt = 15;
  uint32 format = 16;
  bool response_exp = 17;
  bool response_prio = 18;
  bool dl_wind_req = 19;
  bool exp_only = 20;
  reserved 21;  // Removed: confirmed (non-MIOTY)
  int64 que_id = 22 [jstype = JS_STRING]; // Queue ID per BSSCI §3.14.1. JS_STRING avoids JavaScript Number precision loss on 64-bit IDs (Number safe range ends at 2^53 ~ 9e15; queIds are ~1.78e18 and round to the nearest hundred without this annotation, breaking revoke).
  int32 attempts = 23;                 // Internal queue management
  int32 max_attempts = 24;             // Internal queue management
  int64 transmission_packet_cnt = 25;  // End Point packet counter when transmitted per BSSCI §3.14.1
  repeated bytes payloads = 26;        // Full payload array (mirrors SendDownlinkRequest.payloads)
  bool dl_rx_stat_qry = 27;            // SCACI §3.10.1: True to query DL RX status from endpoint
}

// Request downlink results - includes transmitted, expired, failed entries
message GetDownlinkResultsRequest {
  string tenant_id = 1;
  string epEui = 2; // optional, filter by device
  string status_filter = 3; // optional: "transmitted", "expired", "failed"
  int32 page_size = 4;
  string page_token = 5;
  google.protobuf.Timestamp time_from = 6; // optional: filter results from this time
  google.protobuf.Timestamp time_to = 7;   // optional: filter results to this time
}

message GetDownlinkResultsResponse {
  repeated DownlinkMessage results = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// ============================================================================
// UL Data Transmit (BSSCI 3.11)
// ============================================================================

message SendULTransmitRequest {
  string epEui = 1;          // Endpoint EUI as hex string
  bytes user_data = 2;        // User data to transmit
  uint32 packet_cnt = 3;      // Packet counter
  bytes nwk_sn_key = 4;       // Network session key (16 bytes)
  uint32 sh_addr = 5;         // Short address
  string profile = 6;         // Optional MIOTY profile
  uint32 format = 7;          // Optional format ID (0-255)
  string tenant_id = 8;       // Optional tenant ID
  string bs_eui = 9;          // Optional target base station EUI (16 hex chars)
}

message SendULTransmitResponse {
  string id = 1;              // Operation ID
  string status = 2;          // Status (queued, failed, etc.)
  string message = 3;         // Optional status message
}

// Base Station Status Request (BSSCI 3.5)
message BaseStationStatusRequest {
  uint64 bs_eui = 1;          // Base Station EUI
}

message BaseStationStatusResponse {
  bool success = 1;           // Whether the request was sent successfully
  string message = 2;         // Status or error message
  int64 op_id = 3 [jstype = JS_STRING]; // Operation ID. JS_STRING for int64 precision (same rationale as DownlinkMessage.que_id).
}

// Ping Request (BSSCI §5.4)
message InitiatePingRequest {
  uint64 bs_eui = 1;  // Base Station EUI
}

message InitiatePingResponse {
  bool success = 1;      // Whether ping was sent successfully
  string message = 2;    // Status or error message
  int64 op_id = 3 [jstype = JS_STRING]; // Operation ID. JS_STRING for int64 precision.
}

// ============================================================================
// System Operations
// ============================================================================

// ServiceStatus represents health state of a monitored service.
message ServiceStatus {
  string name = 1;
  string url = 2;
  bool healthy = 3;
  int32 latency_ms = 4;
  string error = 5;
  google.protobuf.Timestamp checked_at = 6;
}

message SystemStatus {
  string version = 1;
  string status = 2;
  google.protobuf.Timestamp uptime = 3;
  int32 active_endpoints = 4;
  int32 active_basestations = 5;
  int64 messages_processed = 6;
  repeated ServiceStatus services = 7;
}

// ReleaseInfo provides build and version metadata
message ReleaseInfo {
  // Build metadata
  string version = 1;        // Semantic version from git tags
  string build_time = 2;     // ISO 8601 timestamp
  string git_commit = 3;     // Full git commit hash
  string git_branch = 4;     // Git branch name
  string build_user = 5;     // User who built the binary
  string go_version = 6;     // Go compiler version
  int32 schema_version = 7;  // Database schema version (migration count)
  map<string, string> artifacts = 8;  // Binary artifact paths

  // Service Center identity (BSSCI §5.3.2 / SCACI §3.3.2)
  uint64 sc_eui = 9;         // Service Center EUI-64
  string sc_vendor = 10;     // Vendor name (e.g., "KiloCenter")
  string sc_model = 11;      // Model (e.g., "Enterprise")
  string sc_name = 12;       // Instance name (from general.server_name)
  string sc_sw_version = 13; // Software version (override or default)

  // Distribution and legal metadata
  string edition          = 14; // Build edition (e.g., "Community Edition")
  string license_id       = 15; // SPDX license identifier (e.g., "AGPL-3.0-or-later")
  string license_url      = 16; // URL to full license text
  string source_url       = 17; // Source code repository URL
  string documentation_url = 18; // Documentation URL
  string homepage_url     = 19; // Project homepage URL
  string trademark_notice = 20; // Trademark ownership statement
  string edition_code     = 21; // Runtime edition code ("ce" or "ece") for feature gating
}

message GetStatisticsRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  string granularity = 4; // hour, day, week, month
}

message Statistics {
  int64 total_messages = 1;
  int64 total_endpoints = 2;
  int64 total_basestations = 3;
  repeated TimeSeriesData message_counts = 4;
  map<string, int64> endpoint_message_counts = 5;
  map<string, int64> basestation_message_counts = 6;
}

message TimeSeriesData {
  google.protobuf.Timestamp timestamp = 1;
  int64 value = 2;
}

// ============================================================================
// DL RX Status (BSSCI 3.15-3.16)
// ============================================================================

message DLRXStatus {
  string ep_eui = 1;
  string bs_eui = 2;
  int64 rx_time = 3;       // Unix UTC ns
  uint32 packet_cnt = 4;
  double dl_rx_snr = 5;    // dB
  double dl_rx_rssi = 6;   // dBm
  google.protobuf.Timestamp created_at = 7;
}

message GetDLRXStatusRequest {
  string ep_eui = 1;
  int32 limit = 2;
  int32 offset = 3;
  google.protobuf.Timestamp start_time = 4;  // Optional time range filter
  google.protobuf.Timestamp end_time = 5;    // Optional time range filter
}

message GetDLRXStatusResponse {
  repeated DLRXStatus statuses = 1;
  int32 total_count = 2;
  // Aggregate metrics for the requested period
  double avg_snr = 3;
  double avg_rssi = 4;
}

message QueryDLRXStatusRequest {
  string ep_eui = 1;
}

message QueryDLRXStatusResponse {
  bool query_initiated = 1;
  string message = 2;
}

// DL RX Status Query tracking (BSSCI §5.15 telemetry)
message DLRXStatusQuery {
  string ep_eui = 1;           // Hex string (16 chars)
  string bs_eui = 2;           // Hex string (16 chars)
  int64 op_id = 3 [jstype = JS_STRING]; // SC operation ID (negative). JS_STRING for int64 precision.
  string status = 4;           // "pending"|"received"|"timeout"
  google.protobuf.Timestamp requested_at = 5;
  google.protobuf.Timestamp received_at = 6;  // Optional (null if not received)
  string org_uuid = 7;         // Organization UUID for multi-tenant filtering (optional)
}

message GetDLRXStatusQueriesRequest {
  string ep_eui = 1;
  int32 limit = 2;             // Default 20, max 100
  int32 offset = 3;
  google.protobuf.Timestamp start_time = 4;  // Optional time range filter
  google.protobuf.Timestamp end_time = 5;    // Optional time range filter
}

message DLRXStatusQueryStats {
  int64 pending = 1;
  int64 received = 2;
  int64 timeout = 3;
}

message GetDLRXStatusQueriesResponse {
  repeated DLRXStatusQuery queries = 1;
  int64 total_count = 2;
  DLRXStatusQueryStats stats = 3;
}

