  string format = 2;          // csv, json
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  string direction = 5;       // Filter: "uplink" | "downlink" | "" (all)
  string ep_eui = 6;          // Optional: filter by endpoint EUI
}

message ExportBaseStationMessagesResponse {
  bytes content = 1;
  string filename = 2;
  string content_type = 3;
}

message StreamBaseStationMessagesRequest {
  string bs_eui = 1;
  string direction = 2;       // Filter: "uplink" | "downlink" | "" (all)
  string ep_eui = 3;          // Optional: filter by endpoint EUI
}

// Note: StreamBaseStationMessages returns stream BaseStationMessage

message BaseStationMessage {
  string id = 1;
  string bs_eui = 2;
  string ep_eui = 3;
  bytes payload = 4;
  double rssi = 5;
  double snr = 6;
  double eq_snr = 7;
  string uplink_mode = 8;
  uint32 packet_counter = 9;
  google.protobuf.Timestamp received_at = 10;
  string direction = 11; // "uplink" or "downlink"
  repeated BaseStationReceptionInfo base_stations = 12; // Multi-BS reception data per SCACI §3.8.1
  bool duplicate = 13;              // True when message received by multiple base stations
  bytes decoded_payload = 20;       // JSON-encoded decoded payload from blueprint
  string decode_status = 21;        // Decode status (success/failed/skipped/pending)
  string decode_error_code = 22;    // Blueprint decoder error token (empty on success)
}

message BaseStationMessageStats {
  string bs_eui = 1;
  int64 total_messages = 2;
  int64 unique_endpoints = 3;
  double avg_rssi = 4;
  double avg_snr = 5;
  int64 messages_today = 6;
  int64 messages_this_week = 7;
  int64 messages_this_month = 8;
  google.protobuf.Timestamp first_message_at = 9;
  google.protobuf.Timestamp last_message_at = 10;
}

// ============================================================================
// EndPoint Stats/Operations Messages
// ============================================================================

message GetEndPointStatsRequest {
  string ep_eui = 1;
}

message GetEndPointStatsResponse {
  string ep_eui = 1;
  int64 total_count = 2;           // From mioty.MessageStats.TotalCount
  int64 unique_endpoints = 3;      // From mioty.MessageStats.UniqueEndpoints
  double avg_rssi = 4;             // From mioty.MessageStats.AvgRSSI
  double avg_snr = 5;              // From mioty.MessageStats.AvgSNR
  google.protobuf.Timestamp first_seen = 6;   // From mioty.MessageStats.FirstSeen
  google.protobuf.Timestamp last_seen = 7;    // From mioty.MessageStats.LastSeen
  int32 active_days = 8;           // From mioty.MessageStats.ActiveDays
  string attach_status = 9;        // From models.EndPoint.EpStatus via GetByEUI()
}

message GetEndPointOperationsRequest {
  string ep_eui = 1;
  int32 page_size = 2;
  int32 offset = 3;
}

message GetEndPointOperationsResponse {
  repeated EndPointOperation operations = 1;
}

message EndPointOperation {
  string id = 1;                   // SystemEvent.ID (UUID string)
  string event_type = 2;           // SystemEvent.EventType
  string category = 3;             // SystemEvent.Category
  string severity = 4;             // SystemEvent.Severity
  string title = 5;                // SystemEvent.Title
  google.protobuf.Timestamp created_at = 6;
}

// ============================================================================
// Global Coverage (server admin only)
// ============================================================================

message ListAllBaseStationLocationsRequest {}

message BaseStationLocation {
  string bs_eui = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  google.protobuf.DoubleValue altitude = 5;
  string location_source = 6;
  bool is_online = 7;
  string org_id = 8;
}

message ListAllBaseStationLocationsResponse {
  repeated BaseStationLocation locations = 1;
  int32 total_count = 2;
}

// ============================================================================
// CE Onboarding & ECE Registry
// ============================================================================

message GetCEStatusRequest {}

message GetCEStatusResponse {
  // onboarding_required is true if the CE installation has not been completed yet.
  bool onboarding_required = 1;
  // ce_id is the assigned CE instance UUID (empty if not yet onboarded).
  string ce_id = 2;
  // company_name is the operator-provided company name (empty if not yet onboarded).
  string company_name = 3;
  // federation_connected indicates whether the CE relay stream is currently active.
  bool federation_connected = 4;
}

message CompleteCEOnboardingRequest {
  string company_name = 1;
}

message CompleteCEOnboardingResponse {
  string ce_id = 1;
  string company_name = 2;
}

message CEInstanceInfo {
  string ce_id = 1;
  string company_name = 2;
  string status = 3;
  string connection_status = 4;
  int32 active_basestation_count = 5;
  int64 total_packets_relayed = 6;
  string ce_version = 7;
  google.protobuf.Timestamp first_seen_at = 8;
  google.protobuf.Timestamp last_heartbeat_at = 9;
}

message ListCEInstancesRequest {
  string status_filter = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListCEInstancesResponse {
  repeated CEInstanceInfo instances = 1;
  int64 total_count = 2;
  string next_page_token = 3;
}

message RevokeCEInstanceRequest {
  string ce_id = 1;
  string reason = 2;
}

message RevokeCEInstanceResponse {
  bool success = 1;
}
