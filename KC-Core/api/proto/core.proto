  string id = 1;
  string event_type = 2;
  string category = 3;
  string severity = 4;
  string title = 5;
  string description = 6;
  string source_name = 7;
  google.protobuf.Timestamp timestamp = 8;
  bytes data = 9;  // JSON-encoded extra data
}

message Alert {
  string id = 1;
  string severity = 2;
  string category = 3;
  string title = 4;
  string description = 5;
  string source_name = 6;
  google.protobuf.Timestamp timestamp = 7;
  string status = 8;  // new, acknowledged, resolved
}

message AlertSummary {
  int32 critical = 1;
  int32 warning = 2;
  int32 info = 3;
  repeated Alert recent = 4;
}

