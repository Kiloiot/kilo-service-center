apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kilocenter.fullname" . }}
  labels:
    {{- include "kilocenter.labels" . | nindent 4 }}
type: Opaque
data:
  postgresql-password: {{ .Values.postgresql.password | b64enc | quote }}
  master-key: {{ required "secrets.masterKey is required (generate with: openssl rand -hex 32)" .Values.secrets.masterKey | b64enc | quote }}
  auth-hmac-secret: {{ .Values.secrets.authHmacSecret | b64enc | quote }}
  internal-peer-secret: {{ required "secrets.internalPeerSecret is required (generate with: openssl rand -hex 32)" .Values.secrets.internalPeerSecret | b64enc | quote }}
  mqtt-admin-password: {{ .Values.secrets.mqttAdminPassword | b64enc | quote }}
  mqtt-client-password: {{ .Values.secrets.mqttClientPassword | b64enc | quote }}
