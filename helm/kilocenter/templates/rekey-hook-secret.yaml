{{- if .Values.rekey.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kilocenter.rekeyHookSecretName" . }}
  labels:
    {{- include "kilocenter.componentLabels" (dict "context" . "component" "rekey") | nindent 4 }}
  annotations:
    # Exists only for the upgrade hooks, which cannot read the release Secret:
    # it still holds the previous release's values while pre-upgrade hooks
    # run, and releases before v1.4 have no master-key in it.
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
data:
  postgresql-password: {{ .Values.postgresql.password | b64enc | quote }}
  master-key: {{ required "secrets.masterKey is required (generate with: openssl rand -hex 32)" .Values.secrets.masterKey | b64enc | quote }}
  {{- with .Values.rekey.legacyPassphrase }}
  legacy-passphrase: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
