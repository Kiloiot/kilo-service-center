apiVersion: v1
kind: Service
metadata:
  name: {{ include "kilocenter.fullname" . }}-mosquitto
  labels:
    {{- include "kilocenter.componentLabels" (dict "context" . "component" "mosquitto") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kilocenter.selectorLabels" (dict "context" . "component" "mosquitto") | nindent 4 }}
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
    - name: websocket
      port: 9001
      targetPort: websocket
      protocol: TCP
