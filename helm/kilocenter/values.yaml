## KiloCenter Helm Chart - Default Values
## Override these in your own values file for production deployments.

nameOverride: ""
fullnameOverride: ""

global:
  imageTag: "latest"
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# External PostgreSQL (user must provision separately)
# ---------------------------------------------------------------------------
postgresql:
  host: "postgresql"
  port: 5432
  username: "kilocenter"
  password: "changeme"           # MUST override in production
  database: "kilocenter"
  sslMode: "disable"
  maxConnections: 25
  maxIdleConns: 5
  connMaxLifetime: 300
  connMaxIdleTime: 60

# ---------------------------------------------------------------------------
# External Redis (user must provision separately)
# ---------------------------------------------------------------------------
redis:
  host: "redis"
  port: 6379

# ---------------------------------------------------------------------------
# Secrets (all MUST be overridden in production)
# ---------------------------------------------------------------------------
secrets:
  authHmacSecret: "dev-secret-must-be-at-least-32-bytes-long"
  mqttAdminPassword: "KiloCenter"
  mqttClientPassword: "kilocenter"

# ---------------------------------------------------------------------------
# KC-Core — BSSCI/SCACI engines, internal gRPC server
# ---------------------------------------------------------------------------
kcCore:
  image:
    repository: ghcr.io/kiloiot/kiloservicecenter/kc-core
    tag: ""                      # defaults to global.imageTag
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  config:
    logLevel: "info"
    logFormat: "json"
    environment: "production"
    edition: "ce"
    bssci:
      port: 5000
      tlsEnabled: true
      tlsMinVersion: "1.2"
    scaci:
      port: 5001
      tlsEnabled: true
      tlsMinVersion: "1.3"
    grpc:
      port: 50051
    health:
      port: 8086
    messageRetentionDays: 90
    protocol:
      maxRetransmissions: 3
      ackTimeout: 5000
      duplicateWindow: 300
      connectionEstablishmentTimeout: 30000
      statusRequestInterval: 30
      statusRequestInitialDelay: 5
      dlrxQueryTimeout: 300
      dlrxCleanupInterval: 60
      bsciCertificatePollInterval: "10s"
      # Service Center EUI. Empty keeps the sc_eui key out of the rendered
      # config so environment variables and the built-in default apply.
      scEui: ""

# ---------------------------------------------------------------------------
# KC-Gateway — external gRPC-web ingress, proxies to KC-Core
# ---------------------------------------------------------------------------
kcGateway:
  image:
    repository: ghcr.io/kiloiot/kiloservicecenter/kc-gateway
    tag: ""
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  config:
    grpc:
      port: 9090
      webEnabled: true
    health:
      port: 8087
    auth:
      enabled: true
      localLoginEnabled: true
      accessTokenTTL: "15m"
      refreshTokenTTL: "24h"
      issuer: "kilocenter"
      audience: "kilocenter-api"
    rateLimit:
      enabled: true
      requestsPerMin: 5
      burst: 3
      cleanupInterval: "10m"
    corsOrigins:
      - "http://localhost"
      - "http://localhost:5173"

# ---------------------------------------------------------------------------
# KC-Identity — authentication and user management
# ---------------------------------------------------------------------------
kcIdentity:
  image:
    repository: ghcr.io/kiloiot/kiloservicecenter/kc-identity
    tag: ""
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  config:
    grpc:
      port: 50052
    health:
      port: 8088
    auth:
      registrationEnabled: true

# ---------------------------------------------------------------------------
# KC-Web — browser UI (nginx serving static files)
# ---------------------------------------------------------------------------
kcWeb:
  image:
    repository: ghcr.io/kiloiot/kiloservicecenter/kc-web
    tag: ""
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 5m
      memory: 32Mi

# ---------------------------------------------------------------------------
# Mosquitto MQTT broker (deployed in-cluster)
# ---------------------------------------------------------------------------
mosquitto:
  image:
    repository: eclipse-mosquitto
    tag: "2.0.22"
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 5m
      memory: 32Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# ---------------------------------------------------------------------------
# TLS certificate generation (Helm pre-install hook)
# ---------------------------------------------------------------------------
certgen:
  image:
    repository: ghcr.io/kiloiot/kiloservicecenter/kc-core
    tag: ""                      # same image as kc-core; contains certgen binary
  serverName: "localhost"

# ---------------------------------------------------------------------------
# Shared certificate PVC
# ---------------------------------------------------------------------------
certPvc:
  size: 100Mi
  storageClass: ""

# ---------------------------------------------------------------------------
# Ingress (standard networking.k8s.io/v1, disabled by default)
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kilocenter.example.com
      paths:
        - path: /
          pathType: Prefix
          service: kc-web
          port: 80
  tls: []
  #  - secretName: kilocenter-tls
  #    hosts:
  #      - kilocenter.example.com
