## KiloCenter Helm Chart - Default Values
## Override these in your own values file for production deployments.

nameOverride: ""
fullnameOverride: ""

global:
  imageTag: "latest"
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# External PostgreSQL (user must provision separately)
# ---------------------------------------------------------------------------
postgresql:
  host: "postgresql"
  port: 5432
  username: "kilocenter"
  password: "changeme"           # MUST override in production
  database: "kilocenter"
  sslMode: "disable"
  maxConnections: 25
  maxIdleConns: 5
  connMaxLifetime: 300
  connMaxIdleTime: 60

# ---------------------------------------------------------------------------
# External Redis (user must provision separately)
# ---------------------------------------------------------------------------
redis:
  host: "redis"
  port: 6379

# ---------------------------------------------------------------------------
# Secrets (all MUST be overridden in production)
# ---------------------------------------------------------------------------
secrets:
  # Key-material master key (64 hex chars or base64 -> 32 bytes). REQUIRED:
  # services fatal without it. Generate it once (openssl rand -hex 32), keep
  # it with your deployment secrets and pass the same value to every upgrade:
  # stored keys cannot be decrypted without it. Never commit a real value.
  masterKey: ""
  authHmacSecret: "dev-secret-must-be-at-least-32-bytes-long"
  # Shared secret KC-Gateway, KC-Core and KC-Identity present on internal gRPC
  # calls. REQUIRED (at least 32 characters): the pods reach each other over
  # the cluster network, and the services refuse to start without it.
  #   --set secrets.internalPeerSecret=$(openssl rand -hex 32)
  internalPeerSecret: ""
  mqttAdminPassword: "KiloCenter"
  mqttClientPassword: "kilocenter"

# ---------------------------------------------------------------------------
# KC-Core — BSSCI/SCACI engines, internal gRPC server
# ---------------------------------------------------------------------------
kcCore:
  image:
    repository: ghcr.io/kiloiot/kiloservicecenter/kc-core
    tag: ""                      # defaults to global.imageTag
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  config:
    logLevel: "info"
    logFormat: "json"
    environment: "production"
    edition: "ce"
    bssci:
      port: 5000
      tlsEnabled: true
      tlsMinVersion: "1.2"
    scaci:
      port: 5001
      tlsEnabled: true
      tlsMinVersion: "1.3"
      # Operations a disconnected Application Center session holds for its
      # resume; one more ends the session's resumability.
      resumeMaxPendingOperations: 10000
    grpc:
      port: 50051
    health:
      port: 8086
    messageRetentionDays: 90
    protocol:
      ackTimeout: 5000
      duplicateWindow: 300
      delivery:
        pollInterval: "1s"
        batchSize: 50
        retryBackoff: "2s"
        maxBackoff: "5m"
        receptionWindow: "500ms"
      downlinkExpiry:
        lifetime: "24h"
        sweepInterval: "5s"
        batchSize: 100
      connectionEstablishmentTimeout: 30000
      socketWriteTimeout: 10000
      statusRequestInterval: 30
      statusRequestInitialDelay: 5
      dlrxQueryTimeout: 300
      dlrxCleanupInterval: 60
      bsciCertificatePollInterval: "10s"
      # Service Center EUI. Empty keeps the sc_eui key out of the rendered
      # config so environment variables and the built-in default apply.
      scEui: ""

# ---------------------------------------------------------------------------
# KC-Gateway — external gRPC-web ingress, proxies to KC-Core
# ---------------------------------------------------------------------------
kcGateway:
  image:
    repository: ghcr.io/kiloiot/kiloservicecenter/kc-gateway
    tag: ""
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  config:
    grpc:
      port: 9090
      webEnabled: true
    health:
      port: 8087
    auth:
      enabled: true
      localLoginEnabled: true
      accessTokenTTL: "15m"
      refreshTokenTTL: "24h"
      issuer: "kilocenter"
      audience: "kilocenter-api"
    rateLimit:
      enabled: true
      requestsPerMin: 5
      burst: 3
      cleanupInterval: "10m"
    corsOrigins:
      - "http://localhost"
      - "http://localhost:5173"

# ---------------------------------------------------------------------------
# KC-Identity — authentication and user management
# ---------------------------------------------------------------------------
kcIdentity:
  image:
    repository: ghcr.io/kiloiot/kiloservicecenter/kc-identity
    tag: ""
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  config:
    grpc:
      port: 50052
    health:
      port: 8088

# ---------------------------------------------------------------------------
# KC-Web — browser UI (nginx serving static files)
# ---------------------------------------------------------------------------
kcWeb:
  image:
    repository: ghcr.io/kiloiot/kiloservicecenter/kc-web
    tag: ""
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 5m
      memory: 32Mi

# ---------------------------------------------------------------------------
# Mosquitto MQTT broker (deployed in-cluster)
# ---------------------------------------------------------------------------
mosquitto:
  image:
    repository: eclipse-mosquitto
    tag: "2.0.22"
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 5m
      memory: 32Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# ---------------------------------------------------------------------------
# TLS certificate generation (Helm pre-install hook)
# ---------------------------------------------------------------------------
certgen:
  image:
    repository: ghcr.io/kiloiot/kiloservicecenter/kc-core
    tag: ""                      # same image as kc-core; contains certgen binary
  serverName: "localhost"

# ---------------------------------------------------------------------------
# At-rest key material conversion (Helm pre-upgrade hook)
# Converts legacy key encodings to the authenticated envelope format and
# reconciles the retired endpoint_keys tables before the new binaries (and
# their startup migrations) run. Idempotent: a clean database is a no-op.
# The hook reads secrets.masterKey, postgresql.password and legacyPassphrase
# from its own short-lived Secret, deleted once the upgrade hooks succeed.
# ---------------------------------------------------------------------------
rekey:
  enabled: true
  mode: apply
  image:
    repository: ghcr.io/kiloiot/kiloservicecenter/kc-core
    tag: ""                      # same image as kc-core; contains the rekey and migrate binaries
  # Schema version the hook migrates to before rekeying: the first version
  # whose endpoint key checks accept envelopes. Never migrates down.
  migrateToVersion: 143
  # Passphrase the deployment set as KC_ENCRYPTION_KEY before v1.4, needed to
  # decrypt the rows it sealed. Leave empty when KC_ENCRYPTION_KEY was never
  # set; when supplied, set allowPublishedDevelopmentKey to false.
  legacyPassphrase: ""
  # Decrypt legacy rows sealed under the published development passphrase.
  # KC-Core used that passphrase whenever KC_ENCRYPTION_KEY was unset, and
  # this chart never set it, so every database installed with the chart up
  # to v1.3.0 holds such rows: their session, message, TLS and pending
  # operation keys were never secret, and the upgrade cannot convert them
  # without this flag.
  allowPublishedDevelopmentKey: true
  archiveExport:
    # Existing PersistentVolumeClaim (writable by uid/gid 1000) that receives
    # the master-key-encrypted export of retired endpoint_keys rows the hook
    # cannot fold into the endpoints table, and of any endpoint_keys_archive
    # rows. Empty: no export location, and the hook fails if such rows exist.
    existingClaim: ""
    # Where the claim is mounted in the hook; each upgrade writes
    # endpoint-keys-<release revision>.enc there.
    mountPath: /var/lib/kilocenter/rekey

# ---------------------------------------------------------------------------
# Shared certificate PVC
# ---------------------------------------------------------------------------
certPvc:
  size: 100Mi
  storageClass: ""

# ---------------------------------------------------------------------------
# Ingress (standard networking.k8s.io/v1, disabled by default)
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kilocenter.example.com
      paths:
        - path: /
          pathType: Prefix
          service: kc-web
          port: 80
  tls: []
  #  - secretName: kilocenter-tls
  #    hosts:
  #      - kilocenter.example.com
