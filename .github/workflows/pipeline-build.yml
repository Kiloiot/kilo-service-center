name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  generate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      registry: ${{ steps.registry.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION=$(cat VERSION)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "new_version=${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
      - id: registry
        run: echo "registry=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - run: echo "Version ${{ steps.version.outputs.new_version }} / Registry ${{ steps.registry.outputs.registry }}" >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: |
          for mod in KC-Core KC-DB KC-Gateway KC-Identity KC-MQTT pkg; do
            echo "::group::Linting $mod"
            (cd "$mod" && golangci-lint run --timeout 5m ./...)
            echo "::endgroup::"
          done
      - name: Run Go vet
        run: |
          for mod in KC-Core KC-DB KC-Gateway KC-Identity KC-MQTT pkg; do
            (cd "$mod" && go vet ./...)
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: Run Go tests (unit only, no DB/infra)
        run: |
          echo "::group::Testing KC-Core"
          (cd KC-Core && go test -short -timeout 5m ./...)
          echo "::endgroup::"
          echo "::group::Testing KC-DB (postgres suite runs in test-postgres)"
          (cd KC-DB && go test -short -timeout 3m $(go list ./... | grep -v /postgres))
          echo "::endgroup::"
          for mod in KC-Gateway KC-Identity KC-MQTT pkg; do
            echo "::group::Testing $mod"
            (cd "$mod" && go test -short -timeout 3m ./...)
            echo "::endgroup::"
          done

  # The KC-DB postgres suite runs against real testcontainers-managed
  # PostgreSQL instances; it takes ~15 minutes and runs in parallel with the
  # image builds rather than gating them.
  test-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: Run KC-DB postgres integration tests
        run: |
          (cd KC-DB && go test -timeout 25m ./storage/postgres/...)

  build-kc-core:
    needs: [generate-version, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ needs.generate-version.outputs.registry }}/kc-core:${{ needs.generate-version.outputs.version }}

  build-kc-gateway:
    needs: [generate-version, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: KC-Gateway/Dockerfile
          push: true
          tags: ${{ needs.generate-version.outputs.registry }}/kc-gateway:${{ needs.generate-version.outputs.version }}

  build-kc-identity:
    needs: [generate-version, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: KC-Identity/Dockerfile
          push: true
          tags: ${{ needs.generate-version.outputs.registry }}/kc-identity:${{ needs.generate-version.outputs.version }}

  build-kc-web:
    needs: [generate-version, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: KC-Web/Dockerfile
          push: true
          tags: ${{ needs.generate-version.outputs.registry }}/kc-web:${{ needs.generate-version.outputs.version }}
